name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Gradle Wrapper JAR
        run: |
          curl -L https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar \
            -o gradle/wrapper/gradle-wrapper.jar

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore skyott.jks \
            -alias skyott \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass skyott123 \
            -keypass skyott123 \
            -dname "CN=Sky OTT, OU=App, O=SkyOTT, L=Dhaka, ST=Dhaka, C=BD"

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign and align APK
        run: |
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          SIGNED=app/build/outputs/apk/release/app-release-signed.apk
          ALIGNED=app/build/outputs/apk/release/SkyOTT-release.apk
          BUILD_TOOLS=$ANDROID_HOME/build-tools/34.0.0

          # Step 1: sign
          jarsigner \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore skyott.jks \
            -storepass skyott123 \
            -keypass skyott123 \
            -signedjar "$SIGNED" \
            "$UNSIGNED" \
            skyott

          # Step 2: zipalign the signed APK
          $BUILD_TOOLS/zipalign -v -p 4 "$SIGNED" "$ALIGNED"

          echo "✅ Final APK: $ALIGNED"
          ls -lh app/build/outputs/apk/release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SkyOTT-release
          path: app/build/outputs/apk/release/SkyOTT-release.apk
          retention-days: 30
