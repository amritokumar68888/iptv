name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # ⚠️ action-এর default 'tools platform-tools' — কিন্তু নতুন cmdline-tools-এ
          # 'tools' package আর নেই, তাই "Failed to find package 'tools'" error হয়।
          # এখানে নিজে প্রয়োজনীয় package গুলো বলে দেওয়া হলো।
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Download Gradle Wrapper JAR
        run: |
          curl -L https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar \
            -o gradle/wrapper/gradle-wrapper.jar

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore app/skyott.jks \
            -alias skyott \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass skyott123 \
            -keypass skyott123 \
            -dname "CN=Sky OTT, OU=App, O=SkyOTT, L=Dhaka, ST=Dhaka, C=BD"

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: skyott.jks
          KEYSTORE_PASS: skyott123
          KEY_ALIAS: skyott
          KEY_PASS: skyott123
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/SkyOTT.apk || \
          mv app/build/outputs/apk/release/app-release-unsigned.apk \
             app/build/outputs/apk/release/SkyOTT.apk || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SkyOTT-release
          path: app/build/outputs/apk/release/SkyOTT.apk
          retention-days: 30
