plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

android {
    namespace 'com.iptvplayer.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.iptvplayer.app"
        minSdk 21
        targetSdk 34
        // ⚠️ IMPORTANT: প্রতিবার নতুন version ছাড়ার সময় versionCode ১ করে বাড়ান।
        // In-app auto update এই versionCode দিয়েই compare করে (UPDATE_SETUP.md দেখুন)।
        versionCode 6
        versionName "1.5"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // ── Release signing ───────────────────────────────────────────────────────
    // ⚠️ keystore password কখনো repo-তে লিখবেন না — public repo হলে সবাই দেখে ফেলবে
    //    এবং আপনার অ্যাপের নামে নকল "update" বানাতে পারবে।
    //    CI-তে GitHub Secrets থেকে env var হিসেবে আসে (UPDATE_SETUP.md দেখুন)।
    //    লোকাল build-এ নিজে env var সেট করুন, নাহলে unsigned APK হবে।
    //
    // ⚠️ একই keystore সব release-এ ব্যবহার করতে হবে, নাহলে অ্যাপ update install হবে না।
    def ksFile  = System.getenv("KEYSTORE_PATH") ?: "skyott.jks"
    def ksPass  = System.getenv("KEYSTORE_PASS")
    def kAlias  = System.getenv("KEY_ALIAS") ?: "skyott"
    def kPass   = System.getenv("KEY_PASS") ?: ksPass
    def canSign = ksPass != null && file(ksFile).exists()

    signingConfigs {
        release {
            if (canSign) {
                storeFile     file(ksFile)
                storePassword ksPass
                keyAlias      kAlias
                keyPassword   kPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (canSign) {
                signingConfig signingConfigs.release
            } else {
                logger.lifecycle("⚠️  Release signing নিষ্ক্রিয় — KEYSTORE_PASS env var বা keystore file নেই (unsigned APK)।")
            }
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // ExoPlayer / Media3
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.2.1'
    implementation 'androidx.media3:media3-exoplayer-rtsp:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'
    implementation 'androidx.media3:media3-common:1.2.1'

    // Glide
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    kapt 'com.github.bumptech.glide:compiler:4.16.0'

    // OkHttp
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Google Play In-App Updates (normal app-এর মতো update, কোনো prompt নেই)
    implementation 'com.google.android.play:app-update:2.1.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Room
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'
}
